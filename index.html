<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>??? PARTY ???</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Boogaloo&family=VT323&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ground-height: 80px;
    --title-glow: #ff6bff;
    --scene-z: 10;
  }

  body {
    background: #0a0a1a;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Boogaloo', cursive;
    position: relative;
    padding-bottom: env(safe-area-inset-bottom);
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-color: #0a0a1a;
    background-image:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,0.85) 0 1.5px, transparent 2.5px),
      radial-gradient(circle at 26% 42%, rgba(255,255,255,0.8) 0 1.2px, transparent 2.3px),
      radial-gradient(circle at 34% 8%, rgba(255,255,255,0.7) 0 1px, transparent 2px),
      radial-gradient(circle at 48% 26%, rgba(255,255,255,0.6) 0 1.3px, transparent 2.4px),
      radial-gradient(circle at 59% 14%, rgba(255,255,255,0.9) 0 1.4px, transparent 2.6px),
      radial-gradient(circle at 67% 38%, rgba(255,255,255,0.7) 0 1.1px, transparent 2.2px),
      radial-gradient(circle at 76% 20%, rgba(255,255,255,0.8) 0 1.2px, transparent 2.3px),
      radial-gradient(circle at 88% 33%, rgba(255,255,255,0.65) 0 1.1px, transparent 2.2px);
    animation: starsPulse 6s ease-in-out infinite alternate;
  }

  @keyframes starsPulse {
    from { opacity: 0.7; }
    to { opacity: 1; }
  }

  .ground {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: var(--ground-height);
    background: #1a1a2e;
    border-top: 3px solid #2a2a4e;
    z-index: 1;
  }

  .ground::before {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 8px;
    background: repeating-linear-gradient(90deg, #2a2a4e 0, #2a2a4e 20px, #1a1a2e 20px, #1a1a2e 40px);
  }

  .scene {
    position: relative;
    z-index: var(--scene-z);
    display: flex;
    flex-direction: column;
    align-items: center;
    width: min(96vw, 760px);
    padding-inline: 8px;
  }

  .title {
    font-family: 'VT323', monospace;
    font-size: clamp(32px, 6vw, 64px);
    color: var(--title-glow);
    text-shadow: 0 0 10px #ff6bff, 0 0 30px #ff00ff;
    letter-spacing: 6px;
    margin-bottom: 12px;
    animation: pulse 2s ease-in-out infinite;
    text-align: center;
  }

  .subtitle {
    font-size: clamp(14px, 2.5vw, 22px);
    color: #888;
    letter-spacing: 3px;
    margin-bottom: 30px;
    text-align: center;
  }

  @keyframes pulse {
    0%, 100% { text-shadow: 0 0 10px #ff6bff, 0 0 30px #ff00ff; }
    50% { text-shadow: 0 0 20px #ff6bff, 0 0 60px #ff00ff, 0 0 80px #aa00aa; }
  }

  .warehouse-wrap {
    cursor: pointer;
    position: relative;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    border: 0;
    background: transparent;
    padding: 0;
    display: block;
    width: min(100%, 520px);
  }

  .warehouse-wrap:focus-visible {
    outline: 3px solid #00ffff;
    outline-offset: 8px;
    border-radius: 6px;
  }

  .warehouse-wrap:active { transform: scale(0.98); }

  .warehouse-image {
    display: block;
    width: 100%;
    max-width: 520px;
    height: auto;
    aspect-ratio: 13 / 8;
    pointer-events: none;
  }

  .click-hint {
    text-align: center;
    color: #555;
    font-size: 16px;
    letter-spacing: 2px;
    margin-top: 10px;
    animation: blink 2.5s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .head-wrap {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .head-wrap.visible { opacity: 1; }

  .bubble {
    position: absolute;
    background: #fffde7;
    border: 3px solid #333;
    border-radius: 16px;
    padding: 12px 16px;
    font-size: clamp(13px, 2vw, 17px);
    color: #222;
    line-height: 1.4;
    width: 220px;
    text-align: center;
    left: 60px;
    top: -10px;
    box-shadow: 4px 4px 0 #333;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.4s ease 0.3s, transform 0.4s ease 0.3s;
    pointer-events: none;
  }

  .bubble.visible {
    opacity: 1;
    transform: scale(1);
  }

  .bubble::before {
    content: '';
    position: absolute;
    left: -18px;
    top: 18px;
    border: 8px solid transparent;
    border-right-color: #333;
  }

  .bubble::after {
    content: '';
    position: absolute;
    left: -12px;
    top: 20px;
    border: 6px solid transparent;
    border-right-color: #fffde7;
  }

  #countdown {
    font-weight: bold;
    color: #e53935;
    display: block;
    font-size: 1.1em;
    margin-top: 4px;
  }

  .beam {
    position: fixed;
    bottom: var(--ground-height);
    width: 3px;
    height: 55vh;
    transform-origin: bottom center;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
    z-index: 2;
    filter: blur(2px);
  }

  .beam.active { opacity: 0.18; }
  .beam:nth-child(1) { left: 10%; background: linear-gradient(to top, #ff00ff, transparent); animation: swing1 3s ease-in-out infinite; }
  .beam:nth-child(2) { left: 25%; background: linear-gradient(to top, #00ffff, transparent); animation: swing2 2.7s ease-in-out infinite; }
  .beam:nth-child(3) { right: 25%; background: linear-gradient(to top, #ffff00, transparent); animation: swing3 3.3s ease-in-out infinite; }
  .beam:nth-child(4) { right: 10%; background: linear-gradient(to top, #ff4400, transparent); animation: swing1 2.5s ease-in-out infinite reverse; }

  @keyframes swing1 { 0%,100%{transform:rotate(-25deg)} 50%{transform:rotate(25deg)} }
  @keyframes swing2 { 0%,100%{transform:rotate(20deg)} 50%{transform:rotate(-30deg)} }
  @keyframes swing3 { 0%,100%{transform:rotate(-15deg)} 50%{transform:rotate(35deg)} }

  .note {
    position: fixed;
    pointer-events: none;
    z-index: 3;
    opacity: 0;
    color: #ff6bff;
    will-change: transform, opacity;
  }

  .note.active {
    animation: floatNote 3s ease-out forwards;
  }

  @keyframes floatNote {
    0% { opacity: 0.9; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(-120px) rotate(30deg); }
  }

  @keyframes rumble {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-2px) rotate(-0.5deg); }
    75% { transform: translateX(2px) rotate(0.5deg); }
  }

  .rumbling { animation: rumble 0.12s linear infinite; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>

<div class="beam" id="b1"></div>
<div class="beam" id="b2"></div>
<div class="beam" id="b3"></div>
<div class="beam" id="b4"></div>

<div class="stars" aria-hidden="true"></div>
<div class="ground" aria-hidden="true"></div>

<main class="scene" aria-labelledby="partyTitle">
  <h1 class="title" id="partyTitle">⚡ ??? ⚡</h1>
  <p class="subtitle">something is happening somewhere</p>

  <button class="warehouse-wrap" id="warehouseWrap" type="button" aria-expanded="false" aria-label="Toggle warehouse party mode">
    <div class="head-wrap" id="headWrap" aria-hidden="true">
      <svg width="54" height="70" viewBox="0 0 54 70" xmlns="http://www.w3.org/2000/svg">
        <rect x="19" y="52" width="16" height="18" fill="#f5c589" rx="3"/>
        <ellipse cx="27" cy="34" rx="22" ry="26" fill="#f5c589"/>
        <ellipse cx="27" cy="12" rx="22" ry="8" fill="#222"/>
        <rect x="5" y="10" width="44" height="8" fill="#222" rx="3"/>
        <circle cx="27" cy="7" r="4" fill="#ff6bff"/>
        <circle cx="19" cy="34" r="4" fill="white"/>
        <circle cx="35" cy="34" r="4" fill="white"/>
        <circle cx="20" cy="34" r="2.5" fill="#111"/>
        <circle cx="36" cy="34" r="2.5" fill="#111"/>
        <circle cx="21" cy="33" r="1" fill="white"/>
        <circle cx="37" cy="33" r="1" fill="white"/>
        <path d="M14 27 Q19 24 24 27" stroke="#8B4513" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M30 27 Q35 24 40 27" stroke="#8B4513" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M21 44 Q27 48 33 44" stroke="#c0725a" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="5" cy="35" rx="4" ry="6" fill="#f0b070"/>
        <ellipse cx="49" cy="35" rx="4" ry="6" fill="#f0b070"/>
        <circle cx="21" cy="46" r="1.2" fill="#daa070" opacity="0.7"/>
        <circle cx="27" cy="47" r="1.2" fill="#daa070" opacity="0.7"/>
        <circle cx="33" cy="46" r="1.2" fill="#daa070" opacity="0.7"/>
      </svg>
      <div class="bubble" id="bubble">
        Come back in:<br>
        <span id="countdown" aria-live="polite">7 days 00:00:00</span>
        ...for the location 👀
      </div>
    </div>

    <object
      id="warehouseObject"
      class="warehouse-image"
      type="image/svg+xml"
      data="warehouse.svg"
      aria-label="Warehouse illustration"
      tabindex="-1">
      Warehouse illustration
    </object>
  </button>

  <p class="click-hint" id="clickHint">[ click / enter / space ]</p>
</main>

<div id="notes" aria-hidden="true"></div>

<script>
const CONFIG = {
  unlockDays: 7,
  svg: {
    width: 520,
    height: 320,
    doorCenterX: 260,
    doorTopY: 165,
    headOffsetY: 55
  },
  notes: {
    chars: ['♪', '♫', '♬', '♩', '🎵'],
    poolSize: 18,
    closeIntervalMs: 3000,
    openIntervalMs: 500,
    hideAfterMs: 3200,
    baseSize: 14,
    sizeVariance: 16
  },
  effects: {
    bubbleDelayMs: 350,
    rumbleStopMs: 800,
    rumbleLoopMs: 120
  },
  audio: {
    lowPassHz: 140,
    lowPassQ: 1,
    outsideLevel: 0.9,
    insideLevel: 0.75
  }
};

let isOpen = false;
let quietStarted = false;

const UNLOCK_DATE = (() => {
  const d = new Date();
  d.setDate(d.getDate() + CONFIG.unlockDays);
  return d;
})();

const wrap = document.getElementById('warehouseWrap');
const headWrap = document.getElementById('headWrap');
const bubble = document.getElementById('bubble');
const countdownEl = document.getElementById('countdown');
const clickHint = document.getElementById('clickHint');
const notesEl = document.getElementById('notes');
const warehouseObject = document.getElementById('warehouseObject');
const beams = [
  document.getElementById('b1'),
  document.getElementById('b2'),
  document.getElementById('b3'),
  document.getElementById('b4')
];

let warehouseSvgEl = null;
let ventGlow = null;
let bassWave = null;

let noteInterval = null;
let countdownInterval = null;
let rumbleInterval = null;
let notePool = [];
let notePoolIndex = 0;

const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
let audioErrorShown = false;
let audioEngine = null;

function showAudioErrorOnce(message) {
  if (audioErrorShown) return;
  audioErrorShown = true;
  console.warn(message);
  clickHint.textContent = '[ visual mode: audio unavailable ]';
}

function initAudioEngine() {
  if (audioEngine) return audioEngine;

  if (!AudioContextCtor) {
    showAudioErrorOnce('AudioContext is not supported in this browser.');
    audioEngine = { enabled: false };
    return audioEngine;
  }

  try {
    const context = new AudioContextCtor();
    const track = new Audio('music.mp3');
    track.loop = true;
    track.preload = 'auto';

    const source = context.createMediaElementSource(track);
    const outsideLPF = context.createBiquadFilter();
    outsideLPF.type = 'lowpass';
    outsideLPF.frequency.value = CONFIG.audio.lowPassHz;
    outsideLPF.Q.value = CONFIG.audio.lowPassQ;

    const outsideGain = context.createGain();
    const insideGain = context.createGain();
    outsideGain.gain.value = 0;
    insideGain.gain.value = 0;

    source.connect(outsideLPF);
    outsideLPF.connect(outsideGain);
    source.connect(insideGain);
    outsideGain.connect(context.destination);
    insideGain.connect(context.destination);

    track.addEventListener('error', () => {
      showAudioErrorOnce('music.mp3 could not be played.');
    });

    audioEngine = {
      enabled: true,
      context,
      track,
      source,
      outsideLPF,
      outsideGain,
      insideGain
    };
  } catch (error) {
    showAudioErrorOnce('Unable to initialize audio engine.');
    audioEngine = { enabled: false };
  }

  return audioEngine;
}

async function ensureAudioPlaying() {
  const audio = initAudioEngine();
  if (!audio.enabled) return;

  try {
    if (audio.context.state === 'suspended') {
      await audio.context.resume();
    }
    if (audio.track.paused) {
      await audio.track.play();
    }
  } catch {
    showAudioErrorOnce('Audio playback was blocked.');
  }
}

function ramp(param, value, seconds) {
  const audio = initAudioEngine();
  if (!audio.enabled) return;
  const now = audio.context.currentTime;
  param.cancelScheduledValues(now);
  param.setValueAtTime(param.value, now);
  param.linearRampToValueAtTime(value, now + seconds);
}

function goOutside() {
  const audio = initAudioEngine();
  if (!audio.enabled) return;
  ramp(audio.outsideGain.gain, CONFIG.audio.outsideLevel, 1.2);
  ramp(audio.insideGain.gain, 0, 0.3);
}

function goInside() {
  const audio = initAudioEngine();
  if (!audio.enabled) return;
  ramp(audio.outsideGain.gain, 0, 0.4);
  ramp(audio.insideGain.gain, CONFIG.audio.insideLevel, 0.5);
}

function updateCountdown() {
  const now = new Date();
  const diff = UNLOCK_DATE - now;
  if (diff <= 0) {
    countdownEl.textContent = 'NOW! 🎉';
    return;
  }
  const days = Math.floor(diff / 86400000);
  const hrs = Math.floor((diff % 86400000) / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);
  const secs = Math.floor((diff % 60000) / 1000);
  countdownEl.textContent = `${days}d ${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
}

function initWarehouseRefs() {
  const doc = warehouseObject.contentDocument;
  if (!doc) return;
  warehouseSvgEl = doc.getElementById('warehouseSvg');
  ventGlow = doc.getElementById('ventGlow');
  bassWave = doc.getElementById('bassWave');
  positionHead();
}

function positionHead() {
  const svgW = warehouseObject.clientWidth || CONFIG.svg.width;
  const svgH = warehouseObject.clientHeight || CONFIG.svg.height;
  const scaleX = svgW / CONFIG.svg.width;
  const scaleY = svgH / CONFIG.svg.height;
  headWrap.style.left = `${CONFIG.svg.doorCenterX * scaleX}px`;
  headWrap.style.top = `${(CONFIG.svg.doorTopY * scaleY) - CONFIG.svg.headOffsetY}px`;
}

function createNotePool() {
  notePool = Array.from({ length: CONFIG.notes.poolSize }, () => {
    const noteEl = document.createElement('div');
    noteEl.className = 'note';
    notesEl.appendChild(noteEl);
    return noteEl;
  });
}

function spawnNote() {
  if (!notePool.length) return;

  const noteEl = notePool[notePoolIndex];
  notePoolIndex = (notePoolIndex + 1) % notePool.length;

  if (noteEl.hideTimer) {
    clearTimeout(noteEl.hideTimer);
    noteEl.hideTimer = null;
  }

  noteEl.classList.remove('active');
  noteEl.textContent = CONFIG.notes.chars[Math.floor(Math.random() * CONFIG.notes.chars.length)];
  const wRect = wrap.getBoundingClientRect();
  noteEl.style.left = `${wRect.left + wRect.width * 0.35 + Math.random() * wRect.width * 0.3}px`;
  noteEl.style.top = `${wRect.top + wRect.height * 0.75 + window.scrollY}px`;
  noteEl.style.color = Math.random() > 0.5 ? '#ff6bff' : '#00ffff';
  noteEl.style.fontSize = `${CONFIG.notes.baseSize + Math.random() * CONFIG.notes.sizeVariance}px`;

  requestAnimationFrame(() => noteEl.classList.add('active'));
  noteEl.hideTimer = setTimeout(() => {
    noteEl.classList.remove('active');
    noteEl.hideTimer = null;
  }, CONFIG.notes.hideAfterMs);
}

function setNotesInterval(ms) {
  if (noteInterval) clearInterval(noteInterval);
  noteInterval = setInterval(spawnNote, ms);
}

function startQuiet() {
  ensureAudioPlaying();
  goOutside();
  setNotesInterval(CONFIG.notes.closeIntervalMs);
  beams.forEach((beam) => beam.classList.add('active'));
  if (bassWave) bassWave.style.opacity = '0.15';
}

function openWarehouse() {
  if (isOpen) return;
  isOpen = true;
  wrap.setAttribute('aria-expanded', 'true');

  ensureAudioPlaying();
  goInside();
  setNotesInterval(CONFIG.notes.openIntervalMs);

  headWrap.classList.add('visible');
  setTimeout(() => bubble.classList.add('visible'), CONFIG.effects.bubbleDelayMs);

  if (warehouseSvgEl) {
    warehouseSvgEl.classList.add('rumbling');
    setTimeout(() => {
      if (warehouseSvgEl) warehouseSvgEl.classList.remove('rumbling');
    }, CONFIG.effects.rumbleStopMs);
  }

  beams.forEach((beam) => {
    beam.classList.add('active');
    beam.style.opacity = '0.38';
  });

  if (ventGlow) ventGlow.setAttribute('opacity', '0.22');
  if (bassWave) bassWave.style.opacity = '0.8';
  clickHint.style.opacity = '0';
}

function closeWarehouse() {
  if (!isOpen) return;
  isOpen = false;
  wrap.setAttribute('aria-expanded', 'false');

  goOutside();
  setNotesInterval(CONFIG.notes.closeIntervalMs);

  headWrap.classList.remove('visible');
  bubble.classList.remove('visible');

  beams.forEach((beam) => {
    beam.style.opacity = '';
  });

  if (ventGlow) ventGlow.setAttribute('opacity', '0');
  if (bassWave) bassWave.style.opacity = '0.15';
  clickHint.style.opacity = '1';
}

function handleWarehouseToggle(event) {
  event.preventDefault();
  if (!quietStarted) {
    quietStarted = true;
    startQuiet();
  }
  if (isOpen) {
    closeWarehouse();
  } else {
    openWarehouse();
  }
}

function handleWrapClick(event) {
  handleWarehouseToggle(event);
}

function handleWrapKeyDown(event) {
  if (event.key === 'Enter' || event.key === ' ') {
    handleWarehouseToggle(event);
  }
}

function handleFirstInteraction() {
  if (quietStarted) return;
  quietStarted = true;
  startQuiet();
}

function cleanupAudio() {
  const audio = audioEngine;
  if (!audio || !audio.enabled) return;

  audio.track.pause();
  audio.track.removeAttribute('src');
  audio.track.load();

  audio.source.disconnect();
  audio.outsideLPF.disconnect();
  audio.outsideGain.disconnect();
  audio.insideGain.disconnect();
  audio.context.close().catch(() => {});
}

function cleanup() {
  window.removeEventListener('resize', positionHead);
  document.removeEventListener('pointerdown', handleFirstInteraction);
  document.removeEventListener('keydown', handleFirstInteraction);
  wrap.removeEventListener('click', handleWrapClick);
  wrap.removeEventListener('keydown', handleWrapKeyDown);
  warehouseObject.removeEventListener('load', initWarehouseRefs);

  if (countdownInterval) clearInterval(countdownInterval);
  if (noteInterval) clearInterval(noteInterval);
  if (rumbleInterval) clearInterval(rumbleInterval);

  notePool.forEach((note) => {
    if (note.hideTimer) clearTimeout(note.hideTimer);
  });

  cleanupAudio();
}

createNotePool();
updateCountdown();
countdownInterval = setInterval(updateCountdown, 1000);

warehouseObject.addEventListener('load', initWarehouseRefs);
window.addEventListener('resize', positionHead);
setTimeout(positionHead, 500);

wrap.addEventListener('click', handleWrapClick);
wrap.addEventListener('keydown', handleWrapKeyDown);

document.addEventListener('pointerdown', handleFirstInteraction, { once: true });
document.addEventListener('keydown', handleFirstInteraction, { once: true });

rumbleInterval = setInterval(() => {
  if (!isOpen || !warehouseSvgEl) return;
  warehouseSvgEl.style.transform = `translateX(${(Math.random() - 0.5) * 1.5}px)`;
  setTimeout(() => {
    if (warehouseSvgEl) warehouseSvgEl.style.transform = '';
  }, 60);
}, CONFIG.effects.rumbleLoopMs);

window.addEventListener('beforeunload', cleanup, { once: true });
</script>
</body>
</html>
