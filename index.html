<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>??? PARTY ???</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Boogaloo&family=VT323&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ground-height: 80px;
    --title-glow: #ff6bff;
    --scene-z: 10;
  }

  body {
    background: #0a0a1a;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Boogaloo', cursive;
    position: relative;
    padding-bottom: max(0px, env(safe-area-inset-bottom));
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-color: #0a0a1a;
    background-image:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,0.85) 0 1.5px, transparent 2.5px),
      radial-gradient(circle at 26% 42%, rgba(255,255,255,0.8) 0 1.2px, transparent 2.3px),
      radial-gradient(circle at 34% 8%, rgba(255,255,255,0.7) 0 1px, transparent 2px),
      radial-gradient(circle at 48% 26%, rgba(255,255,255,0.6) 0 1.3px, transparent 2.4px),
      radial-gradient(circle at 59% 14%, rgba(255,255,255,0.9) 0 1.4px, transparent 2.6px),
      radial-gradient(circle at 67% 38%, rgba(255,255,255,0.7) 0 1.1px, transparent 2.2px),
      radial-gradient(circle at 76% 20%, rgba(255,255,255,0.8) 0 1.2px, transparent 2.3px),
      radial-gradient(circle at 88% 33%, rgba(255,255,255,0.65) 0 1.1px, transparent 2.2px);
    animation: starsPulse 6s ease-in-out infinite alternate;
  }

  @keyframes starsPulse {
    from { opacity: 0.7; }
    to { opacity: 1; }
  }

  .ground {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: var(--ground-height);
    background: #1a1a2e;
    border-top: 3px solid #2a2a4e;
    z-index: 1;
  }

  .ground::before {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 8px;
    background: repeating-linear-gradient(90deg, #2a2a4e 0, #2a2a4e 20px, #1a1a2e 20px, #1a1a2e 40px);
  }

  .scene {
    position: relative;
    z-index: var(--scene-z);
    display: flex;
    flex-direction: column;
    align-items: center;
    width: min(96vw, 760px);
    padding-inline: 8px;
  }

  .title {
    font-family: 'VT323', monospace;
    font-size: clamp(32px, 6vw, 64px);
    color: var(--title-glow);
    text-shadow: 0 0 10px #ff6bff, 0 0 30px #ff00ff;
    letter-spacing: 6px;
    margin-bottom: 12px;
    animation: pulse 2s ease-in-out infinite;
    text-align: center;
  }

  .subtitle {
    font-size: clamp(14px, 2.5vw, 22px);
    color: #888;
    letter-spacing: 3px;
    margin-bottom: 30px;
    text-align: center;
  }

  @keyframes pulse {
    0%, 100% { text-shadow: 0 0 10px #ff6bff, 0 0 30px #ff00ff; }
    50% { text-shadow: 0 0 20px #ff6bff, 0 0 60px #ff00ff, 0 0 80px #aa00aa; }
  }

  .warehouse-wrap {
    cursor: pointer;
    position: relative;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    border: 0;
    background: transparent;
    padding: 0;
    display: block;
    width: min(100%, 520px);
  }

  .warehouse-wrap:focus-visible {
    outline: 3px solid #00ffff;
    outline-offset: 8px;
    border-radius: 6px;
  }

  .warehouse-wrap:active { transform: scale(0.98); }

  .warehouse-image {
    display: block;
    width: 100%;
    max-width: 520px;
    height: auto;
    aspect-ratio: 13 / 8;
    pointer-events: none;
  }

  .click-hint {
    text-align: center;
    color: #555;
    font-size: 16px;
    letter-spacing: 2px;
    margin-top: 10px;
    animation: blink 2.5s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .head-wrap {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .head-wrap.visible { opacity: 1; }

  .bubble {
    position: absolute;
    background: #fffde7;
    border: 3px solid #333;
    border-radius: 16px;
    padding: 12px 16px;
    font-size: clamp(13px, 2vw, 17px);
    color: #222;
    line-height: 1.4;
    width: 220px;
    text-align: center;
    left: 60px;
    top: -10px;
    box-shadow: 4px 4px 0 #333;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.4s ease 0.3s, transform 0.4s ease 0.3s;
    pointer-events: none;
  }

  .bubble.visible {
    opacity: 1;
    transform: scale(1);
  }

  .bubble::before {
    content: '';
    position: absolute;
    left: -18px;
    top: 18px;
    border: 8px solid transparent;
    border-right-color: #333;
  }

  .bubble::after {
    content: '';
    position: absolute;
    left: -12px;
    top: 20px;
    border: 6px solid transparent;
    border-right-color: #fffde7;
  }

  #countdown {
    font-weight: bold;
    color: #e53935;
    display: block;
    font-size: 1.1em;
    margin-top: 4px;
  }

  .beam {
    position: fixed;
    bottom: var(--ground-height);
    width: 3px;
    height: 55vh;
    transform-origin: bottom center;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
    z-index: 2;
    filter: blur(2px);
  }

  .beam.active { opacity: 0.18; }
  .beam:nth-child(1) { left: 10%; background: linear-gradient(to top, #ff00ff, transparent); animation: swing1 3s ease-in-out infinite; }
  .beam:nth-child(2) { left: 25%; background: linear-gradient(to top, #00ffff, transparent); animation: swing2 2.7s ease-in-out infinite; }
  .beam:nth-child(3) { right: 25%; background: linear-gradient(to top, #ffff00, transparent); animation: swing3 3.3s ease-in-out infinite; }
  .beam:nth-child(4) { right: 10%; background: linear-gradient(to top, #ff4400, transparent); animation: swing1 2.5s ease-in-out infinite reverse; }

  @keyframes swing1 { 0%,100%{transform:rotate(-25deg)} 50%{transform:rotate(25deg)} }
  @keyframes swing2 { 0%,100%{transform:rotate(20deg)} 50%{transform:rotate(-30deg)} }
  @keyframes swing3 { 0%,100%{transform:rotate(-15deg)} 50%{transform:rotate(35deg)} }

  @keyframes rumble {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-2px) rotate(-0.5deg); }
    75% { transform: translateX(2px) rotate(0.5deg); }
  }

  .rumbling { animation: rumble 0.12s linear infinite; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
      scroll-behavior: auto !important;
    }
  }

  #gate {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: opacity 0.6s ease;

  /* scanline texture overlay */
  background-image: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(255, 255, 255, 0.018) 2px,
    rgba(255, 255, 255, 0.018) 4px
  );
}

#gate::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, #1a001a 0%, #000 70%);
  z-index: -1;
}

/* pulsing glow ring behind the text */
#gate::after {
  content: '';
  position: absolute;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(180, 0, 255, 0.12) 0%, transparent 70%);
  animation: gateBreath 2.4s ease-in-out infinite;
}

#gate span {
  font-family: 'Courier New', monospace;
  font-size: clamp(1rem, 4vw, 1.5rem);
  font-weight: 700;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: #fff;
  position: relative;
  z-index: 1;

  /* flicker animation */
  animation: gateFlicker 3.5s step-end infinite;

  /* magenta text glow */
  text-shadow:
    0 0 8px rgba(255, 80, 255, 0.9),
    0 0 24px rgba(255, 80, 255, 0.5),
    0 0 60px rgba(180, 0, 255, 0.3);
}

@keyframes gateFlicker {
  0%, 89%, 91%, 93%, 100% { opacity: 1; }
  90%, 92%                 { opacity: 0.15; }
}

@keyframes gateBreath {
  0%, 100% { transform: scale(1);    opacity: 0.7; }
  50%       { transform: scale(1.15); opacity: 1;   }
}
</style>
</head>
<body>
<div id="gate"><span>tap to enter</span></div>
<div class="beam" id="b1"></div>
<div class="beam" id="b2"></div>
<div class="beam" id="b3"></div>
<div class="beam" id="b4"></div>

<div class="stars" aria-hidden="true"></div>
<div class="ground" aria-hidden="true"></div>

<main class="scene" aria-labelledby="partyTitle">
  <h1 class="title" id="partyTitle">⚡ ??? ⚡</h1>
  <p class="subtitle">something is happening somewhere</p>

  <button class="warehouse-wrap" id="warehouseWrap" type="button" aria-expanded="false" aria-label="Open warehouse party mode">
    <div class="head-wrap" id="headWrap" aria-hidden="true">
      <svg width="54" height="70" viewBox="0 0 54 70" xmlns="http://www.w3.org/2000/svg">
        <rect x="19" y="52" width="16" height="18" fill="#f5c589" rx="3"/>
        <ellipse cx="27" cy="34" rx="22" ry="26" fill="#f5c589"/>
        <ellipse cx="27" cy="12" rx="22" ry="8" fill="#222"/>
        <rect x="5" y="10" width="44" height="8" fill="#222" rx="3"/>
        <circle cx="27" cy="7" r="4" fill="#ff6bff"/>
        <circle cx="19" cy="34" r="4" fill="white"/>
        <circle cx="35" cy="34" r="4" fill="white"/>
        <circle cx="20" cy="34" r="2.5" fill="#111"/>
        <circle cx="36" cy="34" r="2.5" fill="#111"/>
        <circle cx="21" cy="33" r="1" fill="white"/>
        <circle cx="37" cy="33" r="1" fill="white"/>
        <path d="M14 27 Q19 24 24 27" stroke="#8B4513" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M30 27 Q35 24 40 27" stroke="#8B4513" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M21 44 Q27 48 33 44" stroke="#c0725a" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="5" cy="35" rx="4" ry="6" fill="#f0b070"/>
        <ellipse cx="49" cy="35" rx="4" ry="6" fill="#f0b070"/>
        <circle cx="21" cy="46" r="1.2" fill="#daa070" opacity="0.7"/>
        <circle cx="27" cy="47" r="1.2" fill="#daa070" opacity="0.7"/>
        <circle cx="33" cy="46" r="1.2" fill="#daa070" opacity="0.7"/>
      </svg>
      <div class="bubble" id="bubble">
        Come back in:<br>
        <span id="countdown" aria-live="off" aria-atomic="true">7 days 00:00:00</span>
        ...for the location 👀
      </div>
    </div>

    <object
      id="warehouseObject"
      class="warehouse-image"
      type="image/svg+xml"
      data="warehouse.svg"
      aria-hidden="true"
      tabindex="-1">
      Warehouse illustration
    </object>
  </button>

  <p class="click-hint" id="clickHint">click the warehouse to find out more</p>
</main>
<script>
// ================================
// CONFIG — tweak these values
// ================================
const REVEAL_DATE = new Date("2026-12-31T20:00:00");
const LOCATION_TEXT = "LOCATION GOES HERE";

// Audio: how loud each state is (0–1)
const VOLUME_OUTSIDE = 0.9;  // muffled low-pass version heard outside
const VOLUME_INSIDE  = 0.75; // full sound heard inside


// ================================
// DOM REFS
// ================================
const wrap         = document.getElementById('warehouseWrap');
const headWrap     = document.getElementById('headWrap');
const bubble       = document.getElementById('bubble');
const countdownEl  = document.getElementById('countdown');
const clickHint    = document.getElementById('clickHint');
const warehouseObj = document.getElementById('warehouseObject');
const beams        = ['b1','b2','b3','b4'].map(id => document.getElementById(id));

// SVG elements inside the <object> tag — populated once it loads
let svgEl    = null;
let ventGlow = null;
let bassWave = null;

let isOpen = false;


// ================================
// COUNTDOWN
// Updates the timer text every second.
// Once the reveal date passes, shows the location instead.
// ================================
function updateCountdown() {
  const diff = REVEAL_DATE - new Date();

  if (diff <= 0) {
    bubble.innerHTML = `<strong>📍 Location:</strong><br><br>${LOCATION_TEXT}`;
    clearInterval(countdownInterval);
    return;
  }

  const d  = Math.floor(diff / 86400000);
  const h  = Math.floor((diff % 86400000) / 3600000);
  const m  = Math.floor((diff % 3600000)  / 60000);
  const s  = Math.floor((diff % 60000)    / 1000);
  countdownEl.textContent = `${d}d ${pad(h)}:${pad(m)}:${pad(s)}`;
}

const pad = n => String(n).padStart(2, '0');
const countdownInterval = setInterval(updateCountdown, 1000);
updateCountdown(); // run immediately so there's no 1s blank


// ================================
// AUDIO ENGINE
// Sets up Web Audio so we can route the track through two paths:
//   - outsideGain: signal passes through a low-pass filter (muffled bass)
//   - insideGain:  signal goes direct (full sound)
// We crossfade between them on open/close.
//
// NOTE: browsers block autoplay until the user interacts.
// We hook into the first click to start playback.
// ================================
let audio = null; // holds all audio nodes once initialised

function initAudio() {
  if (audio) return; // already set up

  const ctx   = new (window.AudioContext || window.webkitAudioContext)();
  const track = new Audio('music.mp3');
  track.loop = true;

  const source = ctx.createMediaElementSource(track);

  // Low-pass filter — lets bass through, cuts highs (sounds like outside a club)
  const lpf = ctx.createBiquadFilter();
  lpf.type            = 'lowpass';
  lpf.frequency.value = 140;
  lpf.Q.value         = 1;

  const outsideGain = ctx.createGain();
  const insideGain  = ctx.createGain();
  outsideGain.gain.value = 0;
  insideGain.gain.value  = 0;

  // Routing: source → lpf → outsideGain → speakers
  //          source ──────→ insideGain  → speakers
  source.connect(lpf);
  lpf.connect(outsideGain);
  source.connect(insideGain);
  outsideGain.connect(ctx.destination);
  insideGain.connect(ctx.destination);

  audio = { ctx, track, outsideGain, insideGain };
}

// Smoothly ramp a gain value over `secs` seconds
function ramp(gainNode, target, secs) {
  const now = audio.ctx.currentTime;
  gainNode.gain.cancelScheduledValues(now);
  gainNode.gain.setValueAtTime(gainNode.gain.value, now);
  gainNode.gain.linearRampToValueAtTime(target, now + secs);
}

// Resume context + start track (handles browser autoplay restrictions)
async function startPlayback() {
  initAudio();
  if (audio.ctx.state === 'suspended') await audio.ctx.resume();
  if (audio.track.paused) await audio.track.play().catch(() => {});
}

function soundOutside() {
  // Fade in muffled (low-pass) signal, fade out direct
  ramp(audio.outsideGain, VOLUME_OUTSIDE, 1.2);
  ramp(audio.insideGain,  0,              0.3);
}

function soundInside() {
  // Fade out muffled, fade in direct full sound
  ramp(audio.outsideGain, 0,             0.4);
  ramp(audio.insideGain,  VOLUME_INSIDE, 0.5);
}

// ================================
// WAREHOUSE SVG REFS
// The warehouse graphic is an <object> tag; we grab its internals
// after it finishes loading so we can animate elements inside it.
// ================================
function onWarehouseLoaded() {
  const doc = warehouseObj.contentDocument;
  if (!doc) return;
  svgEl    = doc.getElementById('warehouseSvg');
  ventGlow = doc.getElementById('ventGlow');
  bassWave = doc.getElementById('bassWave');
  positionHead();
}

// Keep the peeking head aligned with the door as the window resizes
function positionHead() {
  const scaleX = warehouseObj.clientWidth  / 520;
  const scaleY = warehouseObj.clientHeight / 320;
  headWrap.style.left = `${260 * scaleX}px`;
  headWrap.style.top  = `${165 * scaleY - 55}px`;
}

const gate = document.getElementById('gate');

gate.addEventListener('click', async () => {
  gate.style.opacity = '0';
  setTimeout(() => gate.remove(), 600);
  
  await startPlayback();
  soundOutside();
  setNoteRate(NOTES_CLOSED_MS);
  beams.forEach(b => b.classList.add('active'));
  if (bassWave) bassWave.style.opacity = '0.15';
}, { once: true });

// ================================
// OPEN / CLOSE
// ================================
function openWarehouse() {
  if (isOpen) return;
  isOpen = true;

  soundInside();
  setNoteRate(NOTES_OPEN_MS);

  // Show the peeking head + speech bubble
  headWrap.classList.add('visible');
  setTimeout(() => bubble.classList.add('visible'), 350);

  // Brighten light beams
  beams.forEach(b => { b.classList.add('active'); b.style.opacity = '0.38'; });

  // SVG glow effects
  if (ventGlow) ventGlow.setAttribute('opacity', '0.22');
  if (bassWave) bassWave.style.opacity = '0.8';

  clickHint.style.opacity = '0';
}

function closeWarehouse() {
  if (!isOpen) return;
  isOpen = false;

  soundOutside();
  setNoteRate(NOTES_CLOSED_MS);

  // Hide head + bubble
  headWrap.classList.remove('visible');
  bubble.classList.remove('visible');

  // Reset beam brightness
  beams.forEach(b => b.style.opacity = '');

  // Dim SVG glow effects
  if (ventGlow) ventGlow.setAttribute('opacity', '0');
  if (bassWave) bassWave.style.opacity = '0.15';

  clickHint.style.opacity = '1';
}


// ================================
// EVENTS
// ================================

// Toggle open/closed on click
wrap.addEventListener('click', () => {
  if (isOpen) closeWarehouse();
  else openWarehouse();
});

warehouseObj.addEventListener('load', onWarehouseLoaded);
window.addEventListener('resize', positionHead);
setTimeout(positionHead, 500); // fallback in case load already fired


// ================================
// SVG RUMBLE
// Tiny random horizontal shake while the warehouse is open.
// ================================
setInterval(() => {
  if (!isOpen || !svgEl) return;
  svgEl.style.transform = `translateX(${(Math.random() - 0.5) * 1.5}px)`;
  setTimeout(() => { if (svgEl) svgEl.style.transform = ''; }, 60);
}, 120);
</script>
</body>
</html>
